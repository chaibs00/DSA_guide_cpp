<svg width="600" height="380" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="380" fill="#f8f9fa" rx="8"/>
  
  <!-- Stack (LIFO) -->
  <text x="100" y="25" font-family="Arial, sans-serif" font-size="15" fill="#2d3748" text-anchor="middle" font-weight="bold">Stack (LIFO)</text>
  
  <rect x="40" y="115" width="120" height="45" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2" rx="4"/>
  <text x="100" y="143" font-family="Arial, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">3 (top)</text>
  
  <rect x="40" y="165" width="120" height="45" fill="#BA68C8" stroke="#6A1B9A" stroke-width="2" rx="4"/>
  <text x="100" y="193" font-family="Arial, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">2</text>
  
  <rect x="40" y="215" width="120" height="45" fill="#CE93D8" stroke="#6A1B9A" stroke-width="2" rx="4"/>
  <text x="100" y="243" font-family="Arial, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">1 (bottom)</text>
  
  <!-- Arrow for push/pop -->
  <path d="M 100 95 L 100 110" stroke="#9C27B0" stroke-width="3" fill="none" marker-end="url(#arrowpurple)"/>
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" font-weight="bold">push()</text>
  <path d="M 100 280 L 35 280" stroke="#9C27B0" stroke-width="3" fill="none" marker-end="url(#arrowpurple2)"/>
  <text x="65" y="295" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle" font-weight="bold">pop()</text>
  
  <text x="100" y="320" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Last In, First Out</text>
  
  <!-- Queue (FIFO) -->
  <text x="380" y="60" font-family="Arial, sans-serif" font-size="15" fill="#2d3748" text-anchor="middle" font-weight="bold">Queue (FIFO)</text>
  
  <rect x="240" y="85" width="60" height="45" fill="#00BCD4" stroke="#008395" stroke-width="2" rx="4"/>
  <text x="270" y="113" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">1</text>
  
  <rect x="305" y="85" width="60" height="45" fill="#26C6DA" stroke="#008395" stroke-width="2" rx="4"/>
  <text x="335" y="113" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">2</text>
  
  <rect x="370" y="85" width="60" height="45" fill="#4DD0E1" stroke="#008395" stroke-width="2" rx="4"/>
  <text x="400" y="113" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">3</text>
  
  <rect x="435" y="85" width="60" height="45" fill="#80DEEA" stroke="#008395" stroke-width="2" rx="4"/>
  <text x="465" y="113" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">4</text>
  
  <!-- Arrows for enqueue/dequeue -->
  <path d="M 505 107 L 525 107" stroke="#00BCD4" stroke-width="3" fill="none" marker-end="url(#arrowcyan)"/>
  <text x="545" y="113" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="start" font-weight="bold">enqueue()</text>
  
  <path d="M 230 107 L 210 107" stroke="#00BCD4" stroke-width="3" fill="none" marker-start="url(#arrowcyanrev)"/>
  <text x="170" y="113" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end" font-weight="bold">dequeue()</text>
  
  <text x="380" y="155" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-style="italic">First In, First Out</text>
  
  <!-- Priority Queue -->
  <text x="380" y="195" font-family="Arial, sans-serif" font-size="15" fill="#2d3748" text-anchor="middle" font-weight="bold">Priority Queue</text>
  
  <rect x="260" y="210" width="240" height="45" fill="#F44336" stroke="#C62828" stroke-width="2" rx="4"/>
  <text x="380" y="238" font-family="Arial, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Priority: 10 (top)</text>
  
  <rect x="280" y="260" width="200" height="40" fill="#EF5350" stroke="#C62828" stroke-width="2" rx="4"/>
  <text x="380" y="285" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Priority: 5</text>
  
  <rect x="300" y="305" width="160" height="35" fill="#E57373" stroke="#C62828" stroke-width="2" rx="4"/>
  <text x="380" y="328" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Priority: 1</text>
  
  <text x="380" y="360" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Highest priority element at top</text>
  
  <!-- Marker definitions -->
  <defs>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9C27B0"/>
    </marker>
    <marker id="arrowpurple2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9C27B0"/>
    </marker>
    <marker id="arrowcyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00BCD4"/>
    </marker>
    <marker id="arrowcyanrev" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <polygon points="10 0, 0 3, 10 6" fill="#00BCD4"/>
    </marker>
  </defs>
</svg>