<svg width="600" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="120" fill="#f8f9fa" rx="8"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="16" fill="#2d3748" text-anchor="middle" font-weight="bold">Sequential Storage (Array/Vector)</text>
  
  <!-- Arrow showing direction -->
  <path d="M 80 65 L 100 65" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead1)"/>
  <text x="90" y="55" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">index</text>
  
  <!-- Array elements -->
  <rect x="110" y="50" width="70" height="45" fill="#4CAF50" stroke="#388E3C" stroke-width="2" rx="4"/>
  <text x="145" y="78" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">A</text>
  <text x="145" y="92" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">0</text>
  
  <rect x="190" y="50" width="70" height="45" fill="#66BB6A" stroke="#388E3C" stroke-width="2" rx="4"/>
  <text x="225" y="78" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">B</text>
  <text x="225" y="92" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">1</text>
  
  <rect x="270" y="50" width="70" height="45" fill="#81C784" stroke="#388E3C" stroke-width="2" rx="4"/>
  <text x="305" y="78" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">C</text>
  <text x="305" y="92" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">2</text>
  
  <rect x="350" y="50" width="70" height="45" fill="#9CCC9C" stroke="#388E3C" stroke-width="2" rx="4"/>
  <text x="385" y="78" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">D</text>
  <text x="385" y="92" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">3</text>
  
  <rect x="430" y="50" width="70" height="45" fill="#A8E6A3" stroke="#388E3C" stroke-width="2" rx="4"/>
  <text x="465" y="78" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">E</text>
  <text x="465" y="92" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">4</text>
  
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>