<svg width="600" height="220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="220" fill="#f8f9fa" rx="8"/>
  
  <!-- Title -->
  <text x="300" y="25" font-family="Arial, sans-serif" font-size="16" fill="#2d3748" text-anchor="middle" font-weight="bold">Associative Containers (Key-Value Pairs, Sorted)</text>
  
  <!-- Left side: Key-Value Pairs -->
  <text x="150" y="55" font-family="Arial, sans-serif" font-size="13" fill="#495057" text-anchor="middle" font-weight="bold">Map (Key-Value)</text>
  
  <!-- First pair -->
  <rect x="60" y="70" width="80" height="35" fill="#2196F3" stroke="#1976D2" stroke-width="2" rx="4"/>
  <text x="100" y="93" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Key: 1</text>
  
  <rect x="150" y="70" width="80" height="35" fill="#64B5F6" stroke="#1976D2" stroke-width="2" rx="4"/>
  <text x="190" y="93" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Val: A</text>
  
  <!-- Second pair -->
  <rect x="60" y="115" width="80" height="35" fill="#2196F3" stroke="#1976D2" stroke-width="2" rx="4"/>
  <text x="100" y="138" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Key: 3</text>
  
  <rect x="150" y="115" width="80" height="35" fill="#64B5F6" stroke="#1976D2" stroke-width="2" rx="4"/>
  <text x="190" y="138" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Val: B</text>
  
  <!-- Third pair -->
  <rect x="60" y="160" width="80" height="35" fill="#2196F3" stroke="#1976D2" stroke-width="2" rx="4"/>
  <text x="100" y="183" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Key: 7</text>
  
  <rect x="150" y="160" width="80" height="35" fill="#64B5F6" stroke="#1976D2" stroke-width="2" rx="4"/>
  <text x="190" y="183" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Val: C</text>
  
  <!-- Right side: Binary tree visualization -->
  <text x="430" y="55" font-family="Arial, sans-serif" font-size="13" fill="#495057" text-anchor="middle" font-weight="bold">Set (Unique Keys)</text>
  
  <circle cx="430" cy="90" r="22" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="430" y="96" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">3</text>
  
  <circle cx="370" cy="145" r="22" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="370" y="151" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">1</text>
  
  <circle cx="490" cy="145" r="22" fill="#1976D2" stroke="#0D47A1" stroke-width="2"/>
  <text x="490" y="151" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">7</text>
  
  <!-- Tree connections -->
  <line x1="415" y1="108" x2="385" y2="130" stroke="#0D47A1" stroke-width="2"/>
  <line x1="445" y1="108" x2="475" y2="130" stroke="#0D47A1" stroke-width="2"/>
  
  <text x="430" y="185" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-style="italic">Binary Search Tree</text>
  <text x="430" y="200" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-style="italic">(O(log n) lookup)</text>
</svg>